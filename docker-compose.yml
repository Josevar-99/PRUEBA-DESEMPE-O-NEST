services:
  db:
    # 💡 [ADAPTAR PARA LA PRUEBA]:
    # - Si el enunciado exige otra versión de PostgreSQL (ej: postgres:15-alpine), cámbiala aquí.
    # - Si el enunciado exige MySQL: image: mysql:8.0 y ajusta las variables de entorno.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 💡 Si el puerto 5432 del host ya está ocupado en tu máquina,
      # cambia POSTGRES_PORT en el .env a 5433, 5434, etc.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # 💡 Nombre del volumen persistente para los datos de PostgreSQL
      - pgdata:/var/lib/postgresql/data

  # 💡 Servicio opcional para dockerizar la aplicación si la prueba incluye Dockerfile
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de Docker Compose la BD se llama "db" y escucha en el puerto 5432 interno
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db

volumes:
  pgdata:
