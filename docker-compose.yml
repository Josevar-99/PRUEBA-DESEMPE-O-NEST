services:
  db:
    # 💡 [ADAPT FOR THE TEST]:
    # - If the specification requires another PostgreSQL version (e.g. postgres:15-alpine), change it here.
    # - For MySQL, use image: mysql:8.0 and adjust the environment variables.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 💡 If host port 5432 is already in use, set POSTGRES_PORT in .env to 5433, 5434, etc.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # 💡 Persistent volume name for PostgreSQL data
      - pgdata:/var/lib/postgresql/data

  # 💡 Optional service to run the application in Docker if the test includes a Dockerfile
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the Docker Compose network, the database is named "db" and listens on internal port 5432
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db

volumes:
  pgdata:
